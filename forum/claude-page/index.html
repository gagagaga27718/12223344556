<style>
/* Layout: one centered 960px "portal" box on a checkered desktop, table-based like a 2000-era BBS. Single deliberate light look. */
:root {
  color-scheme: light;
  --desk: #c9d6e8; --desk2: #bfcde2;
  --paper: #ffffff; --row: #f1f5fb; --side: #e6eef9;
  --line: #6b8ab8; --line-soft: #a9bcdb; --line-faint: #d4dff0;
  --head1: #6d93d1; --head2: #3a62a8; --nav1: #5f86c6; --nav2: #2f5597; --navy: #1f3f7a;
  --ink: #111111; --muted: #777777; --link: #003399; --hover: #ff6600;
  --hot: #cc3300; --red: #cc0000; --gold: #ff9900; --on: #229922;
  --note-bg: #fffbe0; --note-line: #ffcc00; --ok-bg: #e8ffe0; --ok-line: #66bb44; --ok-ink: #226600;
  --err-bg: #fff0f0; --err-line: #dd6666; --quote-bg: #f8f8e8; --quote-line: #c8c890;
  --term-bg: #000000; --term-ink: #33ff33;
  --f-body: Verdana, Tahoma, "PingFang SC", "Microsoft YaHei", SimSun, sans-serif;
  --f-logo: "STHeiti", "Heiti SC", SimHei, "PingFang SC", "Microsoft YaHei", sans-serif;
  --f-mono: "Courier New", Menlo, monospace;
}
* { box-sizing: border-box; }
html { background: var(--desk); }
body {
  margin: 0; color: var(--ink); font: 12px/1.6 var(--f-body);
  background-color: var(--desk);
  background-image: linear-gradient(45deg, var(--desk2) 25%, transparent 25%, transparent 75%, var(--desk2) 75%), linear-gradient(45deg, var(--desk2) 25%, transparent 25%, transparent 75%, var(--desk2) 75%);
  background-size: 8px 8px; background-position: 0 0, 4px 4px;
  padding-block: 10px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
a { color: var(--link); text-decoration: none; cursor: pointer; }
a:hover { color: var(--hover); text-decoration: underline; }
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
#wrap { max-width: 960px; margin: 0 auto; background: var(--paper); border: 1px solid var(--line); padding: 6px; box-shadow: 3px 3px 0 #8ea3c4; }

.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 8px 12px; background: linear-gradient(var(--paper), #dfe9f7); border: 1px solid var(--line-soft); }
.logo-cn { display: block; font: bold 32px/1.1 var(--f-logo); letter-spacing: 4px; color: #ff6a00; text-shadow: 2px 2px 0 rgba(0,51,153,.18); }
.logo-en { display: block; font: bold 11px Arial, sans-serif; letter-spacing: 6px; color: var(--head2); }
.slogan { color: #6688bb; font-size: 11px; font-style: italic; }
.ad { border: 2px ridge var(--note-line); background: var(--note-bg); padding: 6px 14px; color: #993300; text-align: center; }
.blink { color: var(--red); font-weight: bold; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { visibility: hidden; } }
@media (prefers-reduced-motion: reduce) { .blink, .new { animation: none; } }

.nav { margin-top: 4px; background: linear-gradient(var(--nav1), var(--nav2)); border: 1px solid var(--navy); display: flex; flex-wrap: wrap; }
.nav a { color: #fff; padding: 5px 12px; font-weight: bold; border-right: 1px solid #6f93cc; }
.nav a:hover { background: #ffcc33; color: var(--navy); text-decoration: none; }
.userbar { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 4px 8px; background: #eef3fb; border: 1px solid var(--line-soft); border-top: 0; }
.muted, .gray { color: var(--muted); }
.marquee-box { margin: 6px 0; border: 1px dashed var(--gold); background: #fffff0; padding: 3px 8px; display: flex; gap: 6px; color: var(--hot); }
.marquee-box marquee { flex: 1; min-width: 0; color: #333; }
.crumbs { margin: 6px 0; padding: 4px 8px; background: #f7f9fd; border: 1px solid var(--line-faint); overflow-wrap: anywhere; }
.flash { margin: 6px 0; padding: 6px 10px; background: var(--ok-bg); border: 1px solid var(--ok-line); color: var(--ok-ink); font-weight: bold; }
.err { margin: 6px 0; padding: 6px 10px; background: var(--err-bg); border: 1px solid var(--err-line); color: var(--red); font-weight: bold; }

.tblwrap { overflow-x: auto; margin: 8px 0; }
.tbl { width: 100%; background: var(--line); border-spacing: 1px; }
.tbl td, .tbl th { padding: 5px 7px; vertical-align: middle; }
.tbl th.cap { background: linear-gradient(var(--head1), var(--head2)); color: #fff; text-align: left; letter-spacing: 1px; }
.cap-desc { font-weight: normal; color: #dfe9ff; font-size: 11px; letter-spacing: 0; }
.tbl tr.sub td { background: #d5e1f4; color: var(--navy); font-weight: bold; }
.tbl td.cat { background: #eaf0fa; color: #cc6600; font-weight: bold; }
.row1 { background: var(--paper); } .row2 { background: var(--row); }
.tbl.two td { vertical-align: top; width: 50%; }
.icon { text-align: center; font-size: 20px; width: 40px; }
.bname { font-weight: bold; font-size: 13px; }
.bdesc { color: #666; font-size: 11px; }
.small { font-size: 11px; } .c { text-align: center; } .red { color: var(--red); }
.list { line-height: 1.9; }
.num { font-variant-numeric: tabular-nums; }
.new { background: #ff3300; color: #fff; font: bold 9px Arial, sans-serif; padding: 0 3px; border-radius: 2px; animation: blink 1.2s steps(1) infinite; vertical-align: 1px; }
.legend { color: #666; font-size: 11px; text-align: center; margin: 4px 0 8px; }
.on { color: var(--on); } .off { color: #999; }
.adm { color: var(--red); font-weight: bold; }
.stars { color: var(--gold); letter-spacing: -1px; }
.actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
.pager { margin-left: auto; }
.pager .cur { color: var(--red); font-weight: bold; }

button, .btn { font: 12px var(--f-body); padding: 2px 10px; background: linear-gradient(#ffffff, #d9e3f2); border: 2px outset #c9d6ea; color: #000; cursor: pointer; }
button:active, .btn:active { border-style: inset; }
a.btn { display: inline-block; text-decoration: none; color: var(--navy); font-weight: bold; padding: 3px 12px; }
a.btn:hover { color: var(--hover); }
button[disabled] { color: #999; cursor: default; }
input, textarea, select { font: 12px var(--f-body); border: 1px solid #7f9db9; padding: 3px 4px; background: #fff; color: var(--ink); max-width: 100%; }
input:focus, textarea:focus { background: #ffffee; }
textarea { width: 100%; font-size: 14px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--link); font: inherit; cursor: pointer; }
.linkbtn:hover { color: var(--hover); text-decoration: underline; }
.linkbtn.armed { color: var(--red); font-weight: bold; }

.form { width: 100%; border-collapse: collapse; }
.form td { padding: 5px; vertical-align: top; }
.form td.lbl { width: 100px; text-align: right; font-weight: bold; color: var(--navy); white-space: nowrap; padding-top: 8px; }
.avatars { display: flex; flex-wrap: wrap; gap: 4px 8px; }
.avatars label { cursor: pointer; font-size: 20px; }
.msg { text-align: center; padding: 10px; }

td.author { width: 170px; background: var(--side); vertical-align: top; text-align: center; padding: 10px 6px; border-right: 1px dashed var(--line-soft); }
.uname { font-weight: bold; font-size: 13px; overflow-wrap: anywhere; }
.avatar { width: 80px; height: 80px; margin: 6px auto; font-size: 50px; line-height: 76px; background: linear-gradient(#fff, #dde7f5); border: 2px ridge #b5c7e3; }
.avatar.big { width: 110px; height: 110px; font-size: 72px; line-height: 104px; }
.rank { color: #cc6600; font-size: 11px; }
.meta { text-align: left; font-size: 11px; color: #555; margin: 6px 8px 0; line-height: 1.7; }
td.postbody { vertical-align: top; padding: 0; }
.post-h { display: flex; justify-content: space-between; gap: 8px; padding: 4px 8px; border-bottom: 1px dotted var(--line-soft); font-size: 11px; }
.floor { color: var(--hot); font-weight: bold; white-space: nowrap; }
.content { padding: 12px 10px; min-height: 90px; font-size: 13px; line-height: 1.8; overflow-wrap: anywhere; }
.edited { padding: 0 10px; color: #999; font-size: 11px; font-style: italic; }
.sig { margin: 10px 10px 0; padding-top: 6px; border-top: 1px dashed #c3d2e8; color: #666; font-size: 11px; max-height: 120px; overflow: hidden; }
.sig::before { content: "———————— 个性签名 ————————"; display: block; color: #aab; font-size: 10px; }
.post-f { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 6px; padding: 4px 8px; font-size: 11px; border-top: 1px dotted var(--line-faint); margin-top: 8px; }
.quote { margin: 6px 0; padding: 6px 10px; background: var(--quote-bg); border: 1px dashed var(--quote-line); color: #555; font-size: 12px; }
.quote-h { color: #996600; font-size: 11px; margin-bottom: 2px; }
.code { margin: 6px 0; padding: 8px; background: var(--term-bg); color: var(--term-ink); font: 12px/1.5 var(--f-mono); border: 2px inset #999; overflow-x: auto; white-space: pre; }
.smile { font-size: 16px; }
.sz1 { font-size: 10px; } .sz2 { font-size: 12px; } .sz3 { font-size: 15px; } .sz4 { font-size: 19px; } .sz5 { font-size: 25px; font-weight: bold; }
.mod { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; padding: 6px 8px; background: #fff7e6; border: 1px solid #ffcc66; }
.ubb-bar { background: #eef3fb; border: 1px solid var(--line-soft); border-bottom: 0; padding: 3px; display: flex; flex-wrap: wrap; gap: 2px; align-items: center; }
.ubb-bar button { padding: 0 6px; min-width: 26px; }
.smilies a { font-size: 17px; padding: 0 1px; }
.smilies a:hover { text-decoration: none; background: #ffcc33; }
.help h3 { color: var(--navy); border-bottom: 1px solid var(--line-soft); margin: 12px 0 6px; font-size: 13px; }
.help code { font-family: var(--f-mono); color: #993300; }
.footer { margin-top: 12px; padding: 10px; text-align: center; border-top: 3px double var(--line); color: #666; font-size: 11px; line-height: 1.9; }
.counter span { display: inline-block; background: var(--term-bg); color: var(--term-ink); font: bold 13px var(--f-mono); padding: 0 3px; margin: 0 1px; border: 1px inset #666; }

@media (max-width: 700px) {
  #wrap { padding: 3px; }
  .ad, .userbar .clock { display: none; }
  .logo-cn { font-size: 24px; }
  td.author { width: 84px; padding: 6px 3px; }
  .avatar { width: 48px; height: 48px; font-size: 30px; line-height: 44px; }
  .meta, .rank .stars, .hide-sm { display: none; }
  .tbl td, .tbl th { padding: 4px; }
  .form td.lbl { width: 64px; white-space: normal; }
  .tbl.two tr { display: flex; flex-direction: column; }
  .tbl.two td, .tbl.two th { width: auto; }
}
</style>

<script>
(function () {
  'use strict';
  var PER_PAGE = 20, BOARD_PAGE = 30;
  var AVATARS = ['🙂','😎','🤓','😺','🐶','🐧','🐼','🦊','🐸','🐵','👾','🤖','👻','🎃','🌻','🍉','⚽','🎸','🚀','💾'];
  var SMILIES = { ':)': '😊', ':-)': '😊', ':(': '😞', ':D': '😄', ';)': '😉', ':P': '😛', ':o': '😮', ":'(": '😢', '8)': '😎', ':@': '😡', '^_^': '😊', '-_-': '😑', 'orz': '🙇' };
  var COLORS = ['red','blue','green','orange','purple','gray','navy','maroon','teal','olive','fuchsia','black'];

  var S = {
    db: null, user: null, room: null, myId: null, isAdmin: false, isOwner: false, canWrite: null, writeRefused: false,
    config: null, members: {}, cfgLoaded: false, memLoaded: false, timedOut: false, unavailable: '',
    names: {}, peers: [], flash: '', flashErr: false, searchQ: '', editing: null, draft: {}
  };
  var M = { threads: {}, list: [], counts: {}, total: 0 };

  // ---------- helpers ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function str(v, max) { return typeof v === 'string' ? v.slice(0, max) : ''; }
  function num(v) { return typeof v === 'number' && isFinite(v) ? v : 0; }
  function isObj(v) { return v && typeof v === 'object' && !Array.isArray(v); }
  function rid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function okId(s) { return typeof s === 'string' && /^[a-z0-9]{1,24}$/.test(s); }
  function p2(n) { return String(n).padStart(2, '0'); }
  function fmt(ms) { if (!ms) return '-'; var d = new Date(ms); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); }
  function day(ms) { return fmt(ms).slice(0, 10); }
  function clip(s, n) { return s.length > n ? s.slice(0, n) + '…' : s; }
  function box(title, inner) { return '<div class="tblwrap"><table class="tbl"><tr><th class="cap">' + title + '</th></tr><tr><td class="row1">' + inner + '</td></tr></table></div>'; }

  function safeUrl(u) { var s = u.replace(/&amp;/g, '&').trim(); return /^https?:\/\/[^\s"<>]+$/i.test(s) ? esc(s) : null; }
  function ubb(src) {
    var s = esc(src).replace(/\r\n?/g, '\n');
    var codes = [];
    s = s.replace(/\[code\]([\s\S]*?)\[\/code\]/gi, function (_, c) { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
    for (var i = 0; i < 3; i++) {
      s = s.replace(/\[quote(?:=([^\]\n]{1,30}))?\]\n?([\s\S]*?)\[\/quote\]\n?/gi, function (_, who, body) {
        return '<div class="quote"><div class="quote-h">' + (who ? '引用 <b>' + who + '</b> 的话：' : '引用：') + '</div>' + body + '</div>';
      });
    }
    s = s.replace(/\[(b|i|u|s)\]([\s\S]*?)\[\/\1\]/gi, function (_, t, b) { t = t.toLowerCase(); return '<' + t + '>' + b + '</' + t + '>'; });
    s = s.replace(/\[color=(#[0-9a-f]{3,6}|[a-z]+)\]([\s\S]*?)\[\/color\]/gi, function (m, c, b) { return (c.charAt(0) === '#' || COLORS.indexOf(c.toLowerCase()) >= 0) ? '<span style="color:' + c + '">' + b + '</span>' : b; });
    s = s.replace(/\[size=([1-5])\]([\s\S]*?)\[\/size\]/gi, '<span class="sz$1">$2</span>');
    s = s.replace(/\[center\]([\s\S]*?)\[\/center\]/gi, '<div style="text-align:center">$1</div>');
    s = s.replace(/\[fly\]([\s\S]*?)\[\/fly\]/gi, '<marquee scrollamount="4">$1</marquee>');
    s = s.replace(/\[url=([^\]\s]+)\]([\s\S]*?)\[\/url\]/gi, function (m, u, t) { var h = safeUrl(u); return h ? '<a href="' + h + '" target="_blank" rel="nofollow noopener noreferrer">' + t + '</a>' : t; });
    s = s.replace(/\[url\]([^\[\s]+)\[\/url\]/gi, function (m, u) { var h = safeUrl(u); return h ? '<a href="' + h + '" target="_blank" rel="nofollow noopener noreferrer">' + h + '</a>' : u; });
    s = s.replace(/\[img\]([^\[\s]+)\[\/img\]/gi, function (m, u) { var h = safeUrl(u); return h ? '<a href="' + h + '" target="_blank" rel="nofollow noopener noreferrer">[查看图片]</a>' : u; });
    Object.keys(SMILIES).forEach(function (k) {
      var re = new RegExp('(^|[\\s>])' + esc(k).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?=$|[\\s<])', 'g');
      s = s.replace(re, '$1<span class="smile">' + SMILIES[k] + '</span>');
    });
    s = s.replace(/\n/g, '<br>');
    return s.replace(/\u0000(\d+)\u0000/g, function (_, i) { return '<pre class="code">' + codes[Number(i)].replace(/^\n/, '') + '</pre>'; });
  }

  function rankOf(uid) {
    if (S.config && S.config.ownerId === uid) return { t: '站长', s: '★★★★★★' };
    var n = M.counts[uid] || 0;
    var R = [[1000, '论坛元老', '★★★★★'], [300, '资深会员', '★★★★'], [100, '高级会员', '★★★'], [30, '中级会员', '★★'], [5, '初级会员', '★'], [0, '新手上路', '☆']];
    for (var i = 0; i < R.length; i++) if (n >= R[i][0]) return { t: R[i][1], s: R[i][2] };
  }
  function member(uid) { return S.members[uid] || null; }
  function nameOf(uid) {
    var m = member(uid);
    if (m && m.nick) return m.nick;
    var p = S.names[uid];
    return (p && p.name) || '网友';
  }
  function avatarOf(uid) { var m = member(uid); return (m && AVATARS.indexOf(m.avatar) >= 0) ? m.avatar : '🙂'; }
  function isOnline(uid) { return S.peers.some(function (p) { return p.by === uid; }); }
  function memberIndex(uid) { return memberOrder().indexOf(uid); }
  function memberOrder() { return Object.keys(S.members).filter(function (u) { return S.members[u].nick; }).sort(function (a, b) { return num(S.members[a].joined) - num(S.members[b].joined); }); }
  function userLink(uid) { var i = memberIndex(uid); var n = esc(nameOf(uid)); return i >= 0 ? '<a href="#member-' + (i + 1) + '">' + n + '</a>' : n; }
  function boards() { return (S.config && Array.isArray(S.config.boards)) ? S.config.boards.filter(function (b) { return isObj(b) && okId(b.id); }) : []; }
  function board(id) { return boards().filter(function (b) { return b.id === id; })[0] || null; }
  function flag(name, tid) { return !!(S.config && isObj(S.config[name]) && S.config[name][tid] === true); }
  function registered() { return !!(S.myId && member(S.myId) && member(S.myId).nick); }
  function mayWrite() { return !!S.db && !!S.myId && S.canWrite !== false && !S.writeRefused; }

  // ---------- derive the forum from member documents ----------
  function derive() {
    var threads = {}, counts = {}, total = 0;
    Object.keys(S.members).forEach(function (uid) {
      var m = S.members[uid];
      var th = isObj(m.threads) ? m.threads : {};
      Object.keys(th).forEach(function (tid) {
        var t = th[tid];
        if (!okId(tid) || !isObj(t)) return;
        threads[tid] = { id: tid, uid: uid, board: str(t.b, 24), title: str(t.t, 80) || '(无标题)', body: str(t.body, 20000), c: num(t.c), e: num(t.e), replies: [] };
      });
    });
    Object.keys(S.members).forEach(function (uid) {
      var m = S.members[uid];
      var rp = isObj(m.replies) ? m.replies : {};
      Object.keys(rp).forEach(function (pid) {
        var r = rp[pid];
        if (!okId(pid) || !isObj(r) || !threads[r.tid]) return;
        threads[r.tid].replies.push({ id: pid, uid: uid, body: str(r.body, 20000), c: num(r.c), e: num(r.e) });
      });
    });
    var list = Object.keys(threads).map(function (k) {
      var t = threads[k];
      t.replies.sort(function (a, b) { return a.c - b.c || (a.id < b.id ? -1 : 1); });
      var last = t.replies[t.replies.length - 1];
      t.lastAt = last ? last.c : t.c; t.lastBy = last ? last.uid : t.uid;
      t.pinned = flag('pinned', t.id); t.locked = flag('locked', t.id);
      counts[t.uid] = (counts[t.uid] || 0) + 1; total++;
      t.replies.forEach(function (r) { counts[r.uid] = (counts[r.uid] || 0) + 1; total++; });
      return t;
    });

    if ((m = h.match(/^thread-([a-z0-9]+)(?:-(\d+|last))?$/))) return { v: 'thread', id: m[1], page: m[2] || '1' };
    if ((m = h.match(/^new(?:-([a-z0-9]+))?$/))) return { v: 'new', board: m[1] || '' };

  document.addEventListener('click', function (e) {
    var a = e.target.closest('[data-act]');
    if (a) { e.preventDefault(); if (ACT[a.getAttribute('data-act')]) ACT[a.getAttribute('data-act')](a); return; }
    var bar = e.target.closest('.ubb-bar');
    if (!bar) return;
    var ta = document.getElementById(bar.getAttribute('data-for'));
    if (!ta) return;
    var sm = e.target.closest('[data-smile]');
    if (sm) { e.preventDefault(); wrap(ta, ' ' + sm.getAttribute('data-smile') + ' ', ''); return; }
    var b = e.target.closest('button[data-tag]');
    if (!b) return;
    var tag = b.getAttribute('data-tag');
    if (tag === 'url') wrap(ta, '[url=https://]', '[/url]');
    else wrap(ta, '[' + tag + ']', '[/' + tag + ']');
  });
  document.addEventListener('change', function (e) {
    var sel = e.target.closest('select[data-tagsel]');
    if (!sel || !sel.value) return;
    var ta = document.getElementById(sel.closest('.ubb-bar').getAttribute('data-for'));
    var tag = sel.getAttribute('data-tagsel');
    wrap(ta, '[' + tag + '=' + sel.value + ']', '[/' + tag + ']');
    sel.value = '';
  });
  document.addEventListener('input', function (e) { if (e.target.tagName === 'TEXTAREA' && e.target.id && e.target.id !== 'edit-body') S.draft[location.hash + '|' + e.target.id] = e.target.value; });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.id === 'reply-body') { var b = document.querySelector('[data-act="reply"]'); if (b) b.click(); }
    if (e.key === 'Enter' && e.target.id === 'search-q') ACT.search();
  });
  window.addEventListener('hashchange', function () { S.editing = null; if (Date.now() - (S.flashAt || 0) > 1500) { S.flash = ''; paintFlash(); } render(true); window.scrollTo(0, 0); });

  function tick() { var d = new Date(); document.getElementById('clock').textContent = fmt(+d); }
  tick(); setInterval(tick, 30000);

  // ---------- boot ----------
  function start() {
    if (!window.claude || !window.claude.use) { S.unavailable = '请在 claude.ai 中打开这个页面，才能浏览和发帖。'; render(); return; }
    Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('room')]).then(function (caps) {
      S.db = caps[0]; S.user = caps[1]; S.room = caps[2];
      if (!S.db) { S.unavailable = '论坛数据暂时读不到。请确认已经登录 claude.ai，然后刷新页面。'; render(); return; }
      var timer = setTimeout(function () { S.timedOut = true; render(); }, 10000);
      function loadedCheck(snap) { if (S.cfgLoaded && S.memLoaded && snap && !snap.metadata.fromCache) { clearTimeout(timer); S.timedOut = false; } }
      S.db.doc('site/config').onSnapshot(function (snap) {
        S.config = snap.exists ? snap.data() : { boards: [] };
        S.cfgLoaded = true; loadedCheck(snap); derive(); render(); claimOwner();
      }, function () { clearTimeout(timer); S.timedOut = true; render(); });
      S.db.collection('members').onSnapshot(function (snap) {
        var mm = {};
        snap.docs.forEach(function (d) { var v = d.data(); if (isObj(v)) mm[d.id] = v; });
        S.members = mm; S.memLoaded = true; loadedCheck(snap); derive(); render();
      }, function () { clearTimeout(timer); S.timedOut = true; render(); });
      if (S.user) {
        Promise.all([S.user.id(), S.user.isOwner(), S.user.canEdit(), S.user.can('data.write')]).then(function (v) {
          S.myId = v[0]; S.isOwner = v[1]; S.isAdmin = v[1] || v[2]; S.canWrite = v[3];
          render(); claimOwner();
        });
      }
      if (S.room) {
        S.room.presence({ here: 1 }).catch(function () {});
        S.room.onPeers(function (ch) { S.peers = ch.peers.slice(); render(); }, function () {});
      }
      render();
    });
  }
  render();
  start();
})();
</script>
